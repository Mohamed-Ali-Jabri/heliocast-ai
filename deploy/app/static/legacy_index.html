<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>STEG HelioCast AI - Dashboard de previsions PV</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root { --orange:#f28c28; --blue:#0f3d5c; --bg:#f4f6f8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Segoe UI, Arial, sans-serif; background:var(--bg); color:#222; }
  header { background:var(--blue); color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:20px; font-weight:600; }
  #badge { font-size:13px; opacity:.9; }
  main { padding:20px 24px; max-width:1200px; margin:0 auto; }
  .card { background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.12); padding:18px; margin-bottom:18px; }
  .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .toolbar label { font-weight:600; }
  select, button { padding:8px 12px; border-radius:6px; border:1px solid #ccc; font-size:14px; background:#fff; }
  button { background:var(--orange); border:none; color:#fff; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.05); }
  .kpi { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:18px; }
  .kpi .box { background:#fff; border-radius:8px; padding:14px 18px; box-shadow:0 1px 4px rgba(0,0,0,.12); min-width:170px; }
  .kpi .box .v { font-size:24px; font-weight:700; color:var(--blue); }
  .kpi .box .l { font-size:12px; color:#666; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:8px 10px; text-align:left; border-bottom:1px solid #eee; }
  th { color:var(--blue); }
  .err { color:#b3261e; padding:12px; background:#fdecea; border-radius:6px; margin-bottom:18px; }
  .hidden { display:none; }
  canvas { max-height:420px; }
</style>
</head>
<body>
<header>
  <h1>STEG HelioCast AI &mdash; Previsions de production photovoltaique</h1>
  <div id="badge">chargement...</div>
</header>

<main>
  <div id="error" class="err hidden"></div>

  <div class="kpi">
    <div class="box"><div class="v" id="kpi_date">&mdash;</div><div class="l">Dernier lot genere</div></div>
    <div class="box"><div class="v" id="kpi_days">&mdash;</div><div class="l">Jours de prevision</div></div>
    <div class="box"><div class="v" id="kpi_sites">&mdash;</div><div class="l">Sites</div></div>
    <div class="box"><div class="v" id="kpi_pk">&mdash;</div><div class="l">Pic moyen (MW)</div></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <label for="site">Site :</label>
      <select id="site"></select>
      <button id="refresh">Actualiser</button>
      <span id="meta" style="font-size:13px;color:#666;"></span>
    </div>
  </div>

  <div class="card">
    <canvas id="chart"></canvas>
  </div>

  <div class="card">
    <h3 style="color:var(--blue);margin-bottom:10px;">Dernier lot (MW par site et jour)</h3>
    <div style="overflow-x:auto;"><table id="table"></table></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const API = "/forecasts/latest";

let state = { rows: [], generated_at: null, site: null };

function showError(msg) { $("error").textContent = msg; $("error").classList.remove("hidden"); }
function hideError() { $("error").classList.add("hidden"); }

async function loadLatest() {
  hideError();
  $("badge").textContent = "chargement des previsions...";
  try {
    const resp = await fetch(API);
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.detail || ("HTTP " + resp.status));
    }
    state = await resp.json();
    render();
  } catch (err) {
    showError("Aucune prevision disponible : " + err.message +
              " (le job quotidien doit tourner avec MySQL).");
    $("badge").textContent = "indisponible";
  }
}

function render() {
  const d = state;
  $("kpi_date").textContent = d.generated_at || "&mdash;";
  $("kpi_days").textContent = d.forecast_days || "&mdash;";
  $("kpi_sites").textContent = (d.sites || []).length;
  const rows = d.data || [];
  const pk = rows.length ? (rows.reduce((s, r) => s + r.prediction_mw, 0) / rows.length).toFixed(2) : "&mdash;";
  $("kpi_pk").textContent = pk;

  const sel = $("site");
  const prev = state.site || sel.value;
  sel.innerHTML = "";
  (d.sites || []).forEach((s) => {
    const opt = document.createElement("option");
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  if (prev && (d.sites || []).includes(prev)) sel.value = prev;

  drawChart(rows, sel.value);
  drawTable(rows);
  $("badge").textContent = "modele v14 (lightgbm) &middot; API OK";
}

function drawChart(rows, siteId) {
  const siteRows = rows.filter((r) => r.site_id === siteId).sort((a, b) => a.timestamp.localeCompare(b.timestamp));
  const labels = siteRows.map((r) => r.timestamp);
  const values = siteRows.map((r) => r.prediction_mw);
  const ctx = $("chart").getContext("2d");
  if (window._chart) window._chart.destroy();
  window._chart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Prevision (MW) - " + siteId,
        data: values,
        borderColor: "#f28c28",
        backgroundColor: "rgba(242,140,40,.15)",
        fill: true,
        tension: 0.25,
        pointRadius: 2,
      }],
    },
    options: {
      responsive: true,
      scales: { x: { ticks: { maxTicksLimit: 24 } }, y: { beginAtZero: true, title: { display: true, text: "MW" } } },
    },
  });
}

function drawTable(rows) {
  const days = [...new Set(rows.map((r) => r.timestamp.slice(0, 10)))].sort();
  const sites = [...new Set(rows.map((r) => r.site_id))].sort();
  const peak = (site, day) =>
    rows.filter((r) => r.site_id === site && r.timestamp.startsWith(day))
        .reduce((m, r) => Math.max(m, r.prediction_mw), 0);

  const head = "<tr><th>Site</th>" + days.map((d) => "<th>" + d + "</th>").join("") + "</tr>";
  const body = sites.map((s) =>
    "<tr><td><b>" + s + "</b></td>" + days.map((d) => "<td>" + peak(s, d).toFixed(2) + "</td>").join("") + "</tr>"
  ).join("");
  $("table").innerHTML = head + body;
}

$("refresh").addEventListener("click", loadLatest);
$("site").addEventListener("change", () => {
  if (window._chart) drawChart(state.data, $("site").value);
});

loadLatest();
setInterval(loadLatest, 5 * 60 * 1000);
</script>
</body>
</html>
