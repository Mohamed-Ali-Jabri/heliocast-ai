# STEG HelioCast AI - orchestration Docker (MySQL + API)
# Usage : docker compose up -d --build  puis ouvrir http://localhost:8000
services:
  mysql:
    image: mysql:8.0
    container_name: heliocast-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_heliocast
      MYSQL_DATABASE: heliocast
      MYSQL_USER: steg
      MYSQL_PASSWORD: steg
      TZ: Africa/Tunis
    ports:
      # 3307 pour eviter un conflit avec un XAMPP local sur 3306
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_heliocast", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: heliocast-api
    # Desactivation de l'entrypoint shell (embrouilles EOL Windows/Linux)
    entrypoint: []
    command:
      - sh
      - -c
      - >-
        echo "[1/3] Attente de MySQL ($$DB_HOST:$$DB_PORT)..."
        && until python -c "import os,pymysql; pymysql.connect(host=os.environ['DB_HOST'],port=int(os.environ['DB_PORT']),user='root',password=os.environ['MYSQL_ROOT_PASSWORD'])"; do sleep 2; done
        && echo "[OK] MySQL prêt"
        && echo "[2/3] Génération des prévisions (job quotidien)..."
        && python -m deploy.app.forecast_job
        && echo "[3/3] Démarrage de l'API sur :8000..."
        && cd /app/deploy
        && exec python -m uvicorn app.api:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: heliocast
      DB_USER: steg
      DB_PASSWORD: steg
      MYSQL_ROOT_PASSWORD: root_heliocast
      FORECAST_DAYS: "7"
      TZ: Africa/Tunis
    ports:
      - "8000:8000"
    volumes:
      - api_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: heliocast-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
    ports:
      - "8085:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  api_logs: